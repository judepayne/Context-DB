[package]
name = "cdb-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cdb"
path = "src/main.rs"

[dependencies]
cdb-core = { path = "../cdb-core" }
cdb-engine = { path = "../cdb-engine" }
cdb-backend-fluree = { path = "../cdb-backend-fluree" }
cdb-projection-redb = { path = "../cdb-projection-redb" }
cdb-source-store = { path = "../cdb-source-store" }
cdb-acquisition = { path = "../cdb-acquisition" }
cdb-provider-pi = { path = "../cdb-provider-pi" }
fluree-db-api.workspace = true
fluree-db-nameservice.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "io-util", "signal"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
subtle.workspace = true
getrandom.workspace = true
toml.workspace = true
fs2.workspace = true
rhai = { version = "=1.26.0", features = ["decimal", "no_float", "internals", "unicode-xid-ident"] }
rust_decimal = "=1.40.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
tempfile.workspace = true

[build-dependencies]
cdb-core = { path = "../cdb-core" }

[dev-dependencies]
fluree-db-core.workspace = true
