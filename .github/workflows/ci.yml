name: Context DB CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      RUST_MIN_STACK: 33554432
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CTXQL_CARGO_EVIDENCE: ${{ github.workspace }}/out/ci-cargo
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy --target "$TARGET"
      - name: Verify native runner architecture
        shell: bash
        run: |
          test "$(rustc -vV | awk '/^host:/ {print $2}')" = "$TARGET"
          python3 --version
          node --version
      - name: Resolve locked dependencies
        run: python3 scripts/cargo_serial.py cargo metadata --locked --all-features --format-version 1
      - name: Format
        run: python3 scripts/cargo_serial.py cargo fmt --all -- --check
      - name: Clippy
        run: python3 scripts/cargo_serial.py cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Rust tests
        run: python3 scripts/cargo_serial.py cargo test --workspace --all-targets --all-features --locked --offline -- --test-threads=1
      - name: Dependency and architecture boundary
        run: python3 scripts/check_workspace.py
      - name: Python tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build release binary
        run: python3 scripts/cargo_serial.py cargo build --release --locked --offline --target "$TARGET" -p cdb-service --bin cdb
      - name: Smoke test and inspect native binary
        shell: bash
        run: |
          binary="target/$TARGET/release/cdb"
          "$binary" --help > out/binary-help.txt
          file "$binary" | tee out/binary-platform.txt
          if [[ "$TARGET" == aarch64-apple-darwin ]]; then
            file "$binary" | grep -q 'arm64'
            otool -L "$binary" | tee out/binary-linking.txt
            otool -l "$binary" > out/binary-load-commands.txt
          else
            file "$binary" | grep -q 'x86-64'
            ldd "$binary" | tee out/binary-linking.txt
            ! grep -q 'not found' out/binary-linking.txt
            readelf --version-info "$binary" > out/binary-symbol-versions.txt
          fi
      - name: Package binary, assets and notices
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            flags+=(--tag "$RELEASE_TAG")
          fi
          python3 scripts/package_release.py --binary "target/$TARGET/release/cdb" \
            --target "$TARGET" --output-dir dist "${flags[@]}"
      - name: Upload tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cdb-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain validation evidence, including wrapper child output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.target }}
          path: out/
          if-no-files-found: warn
          retention-days: 14

  draft-release:
    name: Draft alpha release after both platforms pass
    needs: test-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cdb-*
          merge-multiple: true
          path: dist
      - name: Verify both packages and checksums
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            test -f "dist/cdb-$version-$target.tar.gz"
            test -f "dist/cdb-$version-$target.tar.gz.sha256"
          done
          cd dist
          sha256sum --check --strict *.sha256
      - name: Create draft prerelease (publication requires review)
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 \
            --verify-tag --draft --prerelease \
            --title "Context DB $RELEASE_TAG (alpha)" --notes-file docs/release-notes.md
